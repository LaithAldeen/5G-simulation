*.server.app[62..80].typename = "CbrSender"
*.server.app[62..80].packetSize = 100B
*.server.app[62..80].samplingTime = 0.05s
*.server.app[62..80].destAddress = "weldingArm["+string(ancestorIndex(0)-62)+"]"
*.server.app[62..80].destPort = 1538+ancestorIndex(0)

##################for delivery Robot #############################

