[General]

abstract = true

output-scalar-file-append = false 
output-vector-file-append = false
 
##################### Network configuration ###################################
network = NetworkSlicing.simulations.factory
sim-time-limit = 10s 
#warmup-period = 2s 
repeat=5
seed-set = ${repetition} 
allow-object-stealing-on-deletion = true
debug-on-errors = false
#record-eventlog = true


########################## 	statistics	##############################################
**.vector-recording = false
**.scalar-recording = false

**.sctp.**.scalar-recording = false  # remove annoying statistics from SCTP
**.sctp.**.vector-recording = false  # remove annoying statistics from SCTP

output-scalar-file = ${resultdir}/${configname}/${configname}_${repetition}.sca 
output-vector-file = ${resultdir}/${configname}/${configname}_${repetition}.vec 


################ General parameters  ############## 

**.pMax = 500mW
**.alpha = 2   	#path loss 
**.blerShift = 0	#fault Tolerance with Blocks ## (0) means no fault Tolerance
**.targetBler = 0.1    #(0.1) means make sure the Bler does not exceed 1 of 10 Block 
**.ueNoiseFigure = 9dBm		#the noise that  UEs added to the signal
**.amcType = "NrAmc" 
**.dynamicCellAssociation = true
**.servingNodeId = 0 
**.nrServingNodeId = 1
#*.configurator.assignAddresses = true
**.channelControl.carrierFrequency = 3.5GHz
*.configurator.config = xmldoc("./demo.xml") 
**.schedulingDisciplineDl = "PF"
**.schedulingDisciplineUl = "PF"


**.dynamicLos = false 
**.fixedLos =	true  
**.fading = true 			#this parameter, if true, compute LOS pathloss otherwise compute NLOS pathloss	
**.fadingType = "JAKES"

############### scenario parameters for channel module ##############

**.scenario = "INDOOR_HOTSPOT"
**.buildingHeight = 10m
**.nodebHeight = 8m     #gNodeB height
**.insideBuilding = true 
**.ueHeight = 1.5m
**.downlinkInterference = true
**.uplinkInterference = true
**.enableHandover = true
**.correlationDistance = 2m





############### CA configuration ########################
*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].numerologyIndex = 1  #SCS = 30KHz
*.carrierAggregation.componentCarrier[0].carrierFrequency = 3.5GHz
*.carrierAggregation.componentCarrier[0].numBands = 173#${numRbs=50}

**.useTdd = true 

*.gNodeB*.cellularNic.numCarriers = 1
*.gNodeB*.cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"

#*.ue[*].cellularNic.numCarriers = 1    means every device in the SIMU get this parametrs like(weldingArm ,deliveryRobot ....... )
#*.ue[*].cellularNic.nrChannelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"  means every device in the SIMU get this parametrs like(weldingArm ,deliveryRobot ....... )



############### Floorplan definition  ########################
**.mobility.constraintAreaMinX = 0m 
**.mobility.constraintAreaMinY = 0m 
**.mobility.constraintAreaMinZ = 0m 
**.mobility.constraintAreaMaxX = 120m 
**.mobility.constraintAreaMaxY = 60m 
**.mobility.constraintAreaMaxZ = 10m 
#**.mobility.initFromDisplayString = false


############### Transceiver config ########################
**.transmitter.centerFrequency = 3.5GHz
**.receiver.centerFrequency = 3.5GHz
**.transmitter.bandwidth = 100MHz
**.receiver.bandwidth = 100MHz



############### gNodeB config  ########################

#**.gNodeB*.cellInfo.broadcastMessageInterval = 20ms		#for Handover
**.gNodeB*.cellInfo.microCell = true	
**.gNodeB*.txPower = 250mw    #Based on 3GPP standards 

#**.ueTxPower = 40dBm


**.gNodeB*.mobility.initialX = 38m
**.gNodeB*.mobility.initialY = 27m
**.gNodeB*.mobility.initialZ = 8m

**.gNodeB*.cellularNic.numCarriers = 1



**.gNodeB*.cellInfo.rbyDl= 12   #Number of sub-carriers per RB in DL
**.gNodeB*.cellInfo.rbyUl= 12	#Number of sub-carriers per RB in UL
**.gNodeB*.cellInfo.rbxDl= 7   #Number of OFDM symbols per slot in DL
**.gNodeB*.cellInfo.rbxUl= 7	#Number of OFDM symbols per slot in UL


