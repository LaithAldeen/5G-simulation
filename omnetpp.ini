[Config SCS_30]
extends =  Mobility_Statistics




[Config SCS_60]
extends =  Mobility_Statistics

*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].numerologyIndex = 2  #SCS = 60KHz
*.carrierAggregation.componentCarrier[0].carrierFrequency = 3.5GHz
*.carrierAggregation.componentCarrier[0].numBands = 135#${numRbs=135} based on 3GPP standered


