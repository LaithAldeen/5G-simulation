*.server.numApps = 90
*.server.app[0].typename = "VoipReceiver"       
*.server.app[0].localPort = 1000

*.server.app[1].typename = "CbrReceiver"       
*.server.app[1].localPort = 1001

*.server.app[2].typename = "CbrSender" 
*.server.app[2].packetSize = ${msgLen=1000B}
*.server.app[2].samplingTime = ${sndInt=0.01s}
*.server.app[2].destAddress = "arGlass[0]"
*.server.app[2].destPort = 1002
*.server.app[2].startTime = uniform(0.01s , 0.05s)


*.server.app[3].typename = "TcpEchoApp"
*.server.app[3].localPort = 1003


*.server.app[4].typename = "TcpSessionApp"
*.server.app[4].localPort = 1200
*.server.app[4].connectPort = 1004
*.server.app[4].connectAddress = "arGlass[0]"
*.server.app[4].localAddress = "server"
*.server.app[4].tOpen = 0.1s
*.server.app[4].tSend = 0.5s
*.server.app[4].sendBytes = 10MiB
*.server.app[4].tClose = 10s


*.server.app[5].typename = "BurstReceiver"       
*.server.app[5].localPort = 1005

##################for sensor #############################
*.server.app[6..42].typename = "CbrReceiver"
*.server.app[6..42].localPort = 1500+ancestorIndex(0)

